# Render blueprint for Lumen's API (SPEC-DEPLOY). The frontend is on Vercel; Postgres + auth are on Supabase.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: lumen-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # FastAPI in front, Flask mounted behind it (backend/asgi.py). One worker fits 512 MB;
    # sync Flask runs in the threadpool, and the 100 s LLM request deadline replaces gunicorn's kill.
    startCommand: uvicorn asgi:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    # Deploy a push to main only after its CI run is green.
    branch: main
    autoDeployTrigger: checksPass
    domains:
      - api.lumen.nishantbuilds.me
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: EMAIL_ENCRYPTION_KEY
        generateValue: true
      # Supabase: the session pooler connection string (IPv4; Render's free tier has no IPv6).
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_AUD
        value: authenticated
      - key: ALLOWED_ORIGINS
        value: https://lumen.nishantbuilds.me
      - key: FRONTEND_URL
        value: https://lumen.nishantbuilds.me
      # Text models come from the Groq chain in llm/registry.yaml; invoice images use OpenRouter's free vision model.
      - key: LUMEN_LLM_TIER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
