name: keep-warm

# Render's free tier sleeps after 15 idle minutes; a resume link shouldn't take a minute to wake (SPEC-DEPLOY).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 --retry 2 https://api.lumen.nishantbuilds.me/health
