name: keep-warm

# Render's free tier sleeps after 15 idle minutes; a resume link shouldn't take a minute to wake (SPEC-DEPLOY).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Until the DNS record exists there is nothing to keep warm; after that, a failed ping is a real outage.
      - run: |
          if ! getent hosts api.lumen.nishantbuilds.me > /dev/null; then
            echo "api.lumen.nishantbuilds.me doesn't resolve yet (DNS not set up); skipping."
            exit 0
          fi
          curl -fsS --max-time 90 --retry 2 https://api.lumen.nishantbuilds.me/health
