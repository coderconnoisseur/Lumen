# Regression gates (SPEC-EVAL). A suite fails when at least `min_regressed`
# cases went pass -> fail against the latest committed release for the same
# tier and split. Starting values; revisit after the baseline (EVAL-03).
min_regressed:
  default: 2

# Judged metrics are printed as "unreliable" (and kept out of the README) when
# judge-vs-human agreement on evals/data/judge_gold.jsonl falls below this.
judge_min_kappa: 0.6

# The Ask Lumen audit (docs/direction/ASK-LUMEN-AUDIT.md, SPEC-AGENT-TOOLS §7): hard gates on the 30 questions.
ask_lumen:
  honesty_min: 30
  correctness_min: 24

# The forecast (spec docs/superpowers/specs/2026-10-28-forecast-design.md §5): the chosen method, pooled over users.
# Honest baseline after review (2026-10-28), one demo account + the eval world's two users, 18 backtested months:
# chosen (bills + everyday) 21.8% whole-month, 12.6% from the 15th, 67% / 78% in range; old smoothing forecast 44.8%.
# Per user: demo 12.8%, u1 32.0%, u2 33.6% (the world users spend in a two-month purchase-order cycle). The spec's
# 10% target is not met: these are regression guards set just above today's numbers, for the owner to tighten.
forecast:
  median_error_max: 25      # % off on the whole-month backtest (target in the spec: 10)
  median_error_mid_max: 15  # % off when forecasting from the 15th (target in the spec: 12)
  in_range_min: 60          # % of months whose actual landed inside the range, whole month
  in_range_mid_min: 60      # ... and from the 15th
  baseline_ratio_max: 0.55  # the chosen method's error at most 55% of the old smoothing forecast's
