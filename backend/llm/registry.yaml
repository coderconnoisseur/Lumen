# Model chains per tier and role (SPEC-LLM). The client tries a tier's chain in
# order, then the openrouter chain for the same role. `family` feeds the judge
# rule: a judge must not share a family with the text model it grades.
#
# Groq ids are left empty until the LLM-02 mini-bench picks them from data
# (docs/direction/LLM-BENCH.md). Ollama is for plumbing only; no reported
# numbers come from it. `openrouter/free` is deliberately absent: it routes
# images to any free model, including a content-safety classifier (6b #4).
#
# For openrouter, LLM_TEXT_MODEL / LLM_TEXT_FALLBACK_MODELS and
# LLM_VISION_MODEL / LLM_VISION_FALLBACK_MODELS override these lists.

openrouter:
  text:
    - {model: nvidia/nemotron-3-ultra-550b-a55b:free, family: nemotron}
    # nex-agi/nex-n2.5-pro:free stopped being free on 2026-10-03 (404 "use the paid slug").
    - {model: qwen/qwen3.8-27b:free, family: qwen}
  vision:
    - {model: google/gemma-4-31b-it:free, family: gemma}
    - {model: qwen/qwen3.8-27b:free, family: qwen}
  # Provisional until LLM-02. Not qwen: the ollama tier's text model is qwen,
  # and its judge falls back to this one.
  judge:
    - {model: google/gemma-4-31b-it:free, family: gemma}

# Chosen by the LLM-02 bench (docs/direction/LLM-BENCH.md). No vision model on Groq: invoices are read by Gemini
# (free tier ~1K requests/day), then the openrouter chain. Without GEMINI_API_KEY the chain skips to openrouter.
groq:
  text:
    - {model: openai/gpt-oss-120b, family: openai}
    - {model: qwen/qwen3.8-27b, family: qwen}
    - {model: openai/gpt-oss-20b, family: openai}
  vision:
    # gemini-2.5-flash-lite is closed to new users (404, 2026-10-09); pinned, not -latest, so recordings replay.
    - {model: gemini-3.1-flash-lite, provider: gemini, family: gemini}
  judge:
    - {model: qwen/qwen3.8-27b, family: qwen}

ollama:
  text:
    - {model: "qwen2.5:3b", family: qwen}
  vision: []
  judge: []

# BYOK catalogue (SPEC-BYOK): the only models a user's key may run, per role, best first. Users pick a provider;
# Lumen takes the first model (or the user's pick, if it is still listed). Ids checked 2026-10-16 against each
# provider's model docs and OpenRouter's /models. A retired id: delete the line.
byok:
  openai:
    agent: [gpt-6.1-sol, gpt-5.6-sol]
    text: [gpt-6-luna, gpt-5.4-mini]
    vision: [gpt-6-luna, gpt-5.4-mini]
  anthropic:
    agent: [claude-sonnet-5-5, claude-opus-5-5]  # Sonnet first: its thinking can be switched off (Opus is always on)
    text: [claude-haiku-5-5]
    vision: [claude-haiku-5-5, claude-sonnet-5-5]
  gemini:
    agent: [gemini-4-argon, gemini-3.8-flash]
    text: [gemini-3.5-flash-lite, gemini-3.8-flash]
    vision: [gemini-3.1-flash-lite, gemini-3.8-flash]
  groq:
    agent: [openai/gpt-oss-120b]
    text: [openai/gpt-oss-120b, openai/gpt-oss-20b]
    vision: []  # no production vision model on Groq: vision falls back to another key, else the platform
  openrouter:
    agent: [anthropic/claude-sonnet-5.5, openai/gpt-6.1-sol]
    text: [google/gemini-3.5-flash-lite, openai/gpt-oss-120b]
    vision: [google/gemini-3.1-flash-lite, anthropic/claude-haiku-5.5]
